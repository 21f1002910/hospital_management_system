<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">
  <defs>
    <linearGradient id="nexaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"></stop>
      <stop offset="100%" stop-color="#22c55e"></stop>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="10" y="10" width="40" height="40" rx="12" fill="url(#nexaGradient)"></rect>

  <!-- Medical cross -->
  <rect x="26" y="19" width="8" height="22" rx="2" fill="#ffffff"></rect>
  <rect x="21" y="26" width="18" height="8" rx="2" fill="#ffffff"></rect>

  <!-- Subtle heart/care curve -->
  <path d="M 18 40 Q 22 36 26 40 T 34 40 T 42 40" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
